spring:
  datasource:
    url: jdbc:mysql://localhost:3306/finsight_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_TEST_USERNAME:root}
    password: ${DB_TEST_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

finsight:
  outcome:
    collection:
      enabled: false
  ai:
    enabled: false