spring:
  application:
    name: finsight

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/finsight?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

auth:
  access-token-ttl-seconds: ${ACCESS_TOKEN_TTL_SECONDS:3600}
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:finsight}
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:3000/auth/kakao/callback}
  policy:
    terms-version: ${TERMS_VERSION:test-v1}
    privacy-version: ${PRIVACY_POLICY_VERSION:test-v1}
